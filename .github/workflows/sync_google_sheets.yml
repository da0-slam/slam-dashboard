name: Sync Google Sheets

on:
  schedule:
    # 매일 06:00 UTC = 한국시간(KST, UTC+9) 15:00
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # utils/supabase_client.py가 (st.cache_resource 등에 쓰려고) streamlit을
        # 무조건 import하므로, 스크립트가 그걸 안 써도 설치는 되어 있어야 한다.
        run: pip install requests supabase pandas python-dotenv streamlit

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/sync_google_sheets.py
